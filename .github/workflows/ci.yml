name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smartmeal
          POSTGRES_USER: smartmeal
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartmeal -d smartmeal"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_DB: smartmeal
      POSTGRES_USER: smartmeal
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and dependencies (locked)
        run: |
          pip install uv
          uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Migrations are up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid
        run: uv run python manage.py spectacular --validate --fail-on-warn --file /dev/null
      - name: Tests
        run: uv run pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid and image builds
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose build backend
